name: Foodies CI/CD

# Step 3: every push to main starts the pipeline automatically
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodies-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Step 4: unit tests. If any test fails, the pipeline stops here.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -v

  # ---------------------------------------------------------------------------
  # Steps 5 and 6: build the package and store it in S3
  # ---------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the build name
        id: meta
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=foodies-v${VERSION}-build${{ github.run_number }}.zip" >> "$GITHUB_OUTPUT"
      - name: Package the application
        run: |
          mkdir build
          echo "version=$(cat VERSION)"        >  build-info.txt
          echo "commit=${{ github.sha }}"      >> build-info.txt
          echo "run=${{ github.run_number }}"  >> build-info.txt
          echo "built=$(date -u +%FT%TZ)"      >> build-info.txt
          zip -r "build/${{ steps.meta.outputs.artifact }}" app.py VERSION requirements.txt build-info.txt
      - name: Keep a copy in GitHub (evidence for your report)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: build/${{ steps.meta.outputs.artifact }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload build to S3
        run: |
          aws s3 cp "build/${{ steps.meta.outputs.artifact }}" "s3://${{ secrets.S3_BUCKET }}/builds/${{ steps.meta.outputs.artifact }}"
          # "latest.zip" always points at the newest successful build
          aws s3 cp "build/${{ steps.meta.outputs.artifact }}" "s3://${{ secrets.S3_BUCKET }}/builds/latest.zip"
          aws s3 ls "s3://${{ secrets.S3_BUCKET }}/builds/"

  # ---------------------------------------------------------------------------
  # Steps 7 and 8: the server pulls the latest build from S3, then we verify production
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Tell the EC2 server to deploy the latest build from S3
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ needs.build.outputs.artifact }}" \
            --parameters 'commands=["/usr/local/bin/foodies-deploy.sh ${{ secrets.S3_BUCKET }}"]' \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"
          sleep 8
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}" --output yaml
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" --query Status --output text)
          [ "$STATUS" = "Success" ]
      - name: Verify the live application runs the new version
        run: |
          EXPECTED="${{ needs.build.outputs.version }}"
          for i in $(seq 1 10); do
            LIVE=$(curl -fsS "${{ secrets.PRODUCTION_URL }}/health" | jq -r .version || true)
            echo "Attempt $i: production reports version '$LIVE' (expected '$EXPECTED')"
            [ "$LIVE" = "$EXPECTED" ] && echo "Production verified." && exit 0
            sleep 5
          done
          echo "Production does not show the new version" && exit 1
